name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify graph compiles
        run: python -c "from app.graph.report_graph import get_report_graph; get_report_graph(); print('graph ok')"

      - name: Docker build
        run: docker build -t market-researcher .

  e2e:
    runs-on: ubuntu-latest
    needs: smoke
    if: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env from Secrets
        run: |
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" > .env
          echo "OPENAI_MODEL=gpt-4o-mini" >> .env
          echo "TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}" >> .env
          echo "HTTP_USER_AGENT=MarketResearcherBot/1.0 (contact: github-actions)" >> .env
          echo "LOG_LEVEL=INFO" >> .env

      - name: Run evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          HTTP_USER_AGENT: "MarketResearcherBot/1.0 (contact: github-actions)"
          LOG_LEVEL: INFO
        run: python scripts/evaluate.py
